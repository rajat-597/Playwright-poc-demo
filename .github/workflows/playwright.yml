name: Playwright Tests with Allure

on:
  push:
    branches: [ feature/end2end-tests, main ]
  pull_request:
    branches: [ feature/end2end-tests, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      #  Run tests and generate allure-results
      - name: Run Playwright tests (Chromium only)
        id: run-tests
        run: npx playwright test --project=chromium --reporter=list,allure-playwright
        continue-on-error: true

      #  Generate HTML report for artifact upload
      - name: Generate Playwright HTML Report
        if: always()
        run: npx playwright test --reporter=html

      #  Install Allure CLI
      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline --save-dev

      #  Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report || echo "No allure results found"

        # Upload both reports to GitHub artifacts
      - name: Upload Playwright HTML Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
