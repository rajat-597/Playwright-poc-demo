name: Playwright Tests with Allure

on:
  push:
    branches: [ feature/end2end-tests, main ]
  pull_request:
    branches: [ feature/end2end-tests, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=list,allure-playwright
        # allure-playwright will save raw results to allure-results folder by default

      - name: Generate Playwright HTML Report
        run: npx playwright show-report --reporter=html

      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Allure Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
